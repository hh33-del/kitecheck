name: Kitecheck

on:
  schedule:
    # 04:00 UTC = 06:00 Nederlandse zomertijd. Een tweede regel toevoegen
    # (bv "0 13 * * *") geeft ook een middagmail.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draai kitecheck
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_URL: ${{ vars.PAGES_URL }}
        run: python kitecheck.py

      - name: Commit de tabel
        run: |
          git config user.name  "kitecheck"
          git config user.email "actions@github.com"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "kitecheck $(date -u +%F\ %H:%M)"
          git push
